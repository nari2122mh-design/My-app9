workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Create iOS files
        script: flutter create --org com.myapp --project-name myapp --platforms=ios .
      - name: Get packages
        script: flutter pub get
      - name: Build unsigned IPA
        script: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r app-unsigned.ipa Payload
    artifacts:
      - app-unsigned.ipa
